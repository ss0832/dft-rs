[build-system]
# PEP 639 license metadata (the SPDX `license` string plus `license-files`)
# is only emitted from maturin 1.8 onwards; asking for less produces a wheel
# whose licence fields silently disagree with this file.
requires = ["maturin>=1.8,<2.0"]
build-backend = "tools.build_backend"
backend-path = ["."]

[project]
name = "dft-rs-python"
dynamic = ["version"]
description = "Pure-Rust Gaussian-basis molecular and finite-k periodic Kohn-Sham DFT with Python and ASE interfaces"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party/**/NOTICE.md", "third_party/**/LICENSE"]
authors = [{ name = "ss0832", email = "highlighty876@gmail.com" }]
keywords = ["chemistry", "dft", "hartree-fock", "periodic", "quantum-chemistry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ss0832/dft-rs"
Source = "https://github.com/ss0832/dft-rs"
Documentation = "https://github.com/ss0832/dft-rs/tree/main/docs"

[project.scripts]
dft-rs = "dft_rs.native:cli_main"

[project.optional-dependencies]
# The compiled core has no Python dependencies at all — importing `dft_rs`
# pulls in neither NumPy nor ASE. Both are needed only by the ASE adapter.
# ASE copies empty Atoms through ndarray.shape assignment, deprecated by
# NumPy 2.5. Keep the adapter on the verified warning-free NumPy interface.
ase = ["ase>=3.22", "numpy>=1.23,<2.5"]
test = ["pytest>=7", "ase>=3.22", "numpy>=1.23,<2.5", "ruff>=0.12,<1"]
lint = ["ruff>=0.12,<1"]

[tool.maturin]
bindings = "pyo3"
features = ["python"]
python-source = "python"
module-name = "dft_rs.dft_rs_core"
# The working tree carries build artefacts (a Linux extension left beside
# the package, byte-code caches) that must not travel in a wheel or an
# sdist, and oracle scratch output that is not part of the distribution.
exclude = [
  "python/*.so",
  "python/*.pyd",
  "python/dft_rs/*.so",
  "python/dft_rs/*.pyd",
  "python/dft_rs/*.dll",
  "python/dft_rs/*.pdb",
  "python/dft_rs/*.lib",
  "python/dft_rs/*.exp",
  "**/__pycache__/**",
  "*.log",
  "**/*.log",
  "**/.work/**",
  ".work/**",
  ".git/**",
  ".codex/**",
  ".agents/**",
  "runs/**",
  "d4si/**",
  "target*/**",
  "validation/**",
  "staging-*/**",
  ".venv/**",
  ".pytest_cache/**",
  ".ruff_cache/**",
]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Syntax errors and Pyflakes correctness checks; no blanket suppressions.
select = ["E9", "F"]

[tool.ruff.format]
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-ra"
filterwarnings = ["error"]

