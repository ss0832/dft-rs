[package]
name = "dft-rs"
version = "0.4.0"
edition = "2021"
# The locked dependency graph requires Rust 1.85. Acceptance records name
# the compiler actually used; this declaration is not a minimum-compiler test.
rust-version = "1.85"
authors = ["ss0832 <highlighty876@gmail.com>"]
license = "Apache-2.0"
description = "Pure-Rust Gaussian-basis molecular and finite-k periodic Kohn-Sham DFT with analytic forces."
readme = "README.md"
documentation = "https://docs.rs/dft-rs"
repository = "https://github.com/ss0832/dft-rs"
keywords = ["chemistry", "dft", "hartree-fock", "quantum-chemistry"]
categories = ["science"]
# Whitelist rather than blacklist: the working tree also holds oracle
# scratch directories, downloaded article supplements and several alternate
# `target-*` build directories, none of which belong in a published crate.
include = [
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/tools/oracle/*.py",
    "/tools/bench.py",
    "/tools/bench_hermite.py",
    "/tools/portable_build.py",
    "/tools/api_reference.py",
    "/tools/ledger_check.py",
    "/tools/lint.py",
    "/tools/make_release.py",
    "/tools/verify_release.py",
    "/tools/stage_release.py",
    "/tools/build_backend.py",
    "/tools/__init__.py",
    "/tools/convert_skala_model.py",
    "/tools/fetch_basis.py",
    "/python/dft_rs/*.py",
    "/python/tests/*.py",
    "/python/examples/**",
    "/docs/**",
    "/third_party/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/pyproject.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "!/**/.work/**",
    "!/**/.git/**",
    "!/**/.codex/**",
    "!/**/.agents/**",
    "!/**/.venv/**",
    "!/**/__pycache__/**",
    "!/**/.pytest_cache/**",
    "!/**/.ruff_cache/**",
    "!/**/target*/**",
    "!/**/validation/**",
    "!/**/runs/**",
    "!/**/*.log",
]
autobins = false
default-run = "dft-rs"

[lib]
name = "dft_rs"
crate-type = ["rlib", "cdylib"]

[lints.rust]
warnings = "deny"

[[bin]]
name = "dft-rs"
path = "src/bin/dft_rs_main.rs"

[[bin]]
name = "dft_rs_cli"
path = "src/bin/dft_rs_cli.rs"

[[bin]]
name = "fit_substituent"
path = "src/bin/fit_substituent.rs"

[dependencies]
libm = "0.2"
rayon = "1.10"
faer = { version = "0.24", default-features = false, features = ["std", "linalg", "rayon"] }
pyo3 = { version = "0.23", optional = true, features = ["extension-module", "abi3-py39"] }

[features]
default = []
python = ["pyo3"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Numeric test gates (SCF oracles) are far too slow at opt-level 0.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[lints.clippy]
duplicate_mod = "forbid"
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
# Numeric kernels read more clearly with explicit index loops and long argument lists.
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
